apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-task-manager
  labels:
    app: secure-task-manager
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-task-manager
      component: web
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: secure-task-manager
        component: web
    spec:
      containers:
        - name: web
          image: secure-task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: "task-manager-mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-name
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: secure-task-manager
  labels:
    app: secure-task-manager
    component: web
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: secure-task-manager
    component: web

