apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-manager-mysql-pvc
  labels:
    app: secure-task-manager
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-manager-mysql
  labels:
    app: secure-task-manager
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-task-manager
      component: database
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: secure-task-manager
        component: database
    spec:
      containers:
        - name: mysql
          # Red Hat Official MySQL image (optimized for OpenShift non-root execution)
          image: registry.redhat.io/rhel8/mysql-80:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-manager-secrets
                  key: database-root-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: task-manager-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: task-manager-mysql
  labels:
    app: secure-task-manager
    component: database
spec:
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: secure-task-manager
    component: database

