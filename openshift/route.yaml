apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: secure-task-manager
  labels:
    app: secure-task-manager
spec:
  to:
    kind: Service
    name: secure-task-manager
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

